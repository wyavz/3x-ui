name: Sync Upstream 3x-ui

on:
  schedule:
    # 每天 UTC 时间 00:00（北京时间 08:00）自动检查并同步一次
    - cron: '0 0 * * *'
  # 支持在网页端手动点击运行
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout forked repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Force sync with MHSanaei/3x-ui
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. 先备份当前同步工作流文件
          cp .github/workflows/sync-upstream.yml /tmp/sync-upstream.yml
          
          # 2. 拉取并强制对齐上游代码
          git remote add upstream https://github.com/MHSanaei/3x-ui.git
          git fetch upstream
          git checkout main
          git reset --hard upstream/main
          
          # 3. 还原同步工作流文件并提交
          mkdir -p .github/workflows
          cp /tmp/sync-upstream.yml .github/workflows/sync-upstream.yml
          git add .github/workflows/sync-upstream.yml
          git commit -m "chore: keep sync-upstream workflow"
          
          # 4. 保活检测：如果超过 50 天没有新提交，制造一个空提交重置 60 天休眠计时
          LAST_COMMIT_DATE=$(git log -1 --format=%ct)
          CURRENT_DATE=$(date +%s)
          DAYS_DIFF=$(( (CURRENT_DATE - LAST_COMMIT_DATE) / 86400 ))
          if [ "$DAYS_DIFF" -ge 50 ]; then
            git commit --allow-empty -m "chore: keep workflow active"
          fi
          
          # 5. 推送到你的仓库
          git push origin main --force
